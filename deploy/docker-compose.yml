name: relay

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  entrypoint: ["/app/rest-backend"]

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      RELAY_BACKENDS: http://backend-1:8081,http://backend-2:8082,http://backend-3:8083
      RELAY_JWT_SECRET: ${RELAY_JWT_SECRET:-local-dev-secret-change-me}
      RELAY_CORS_ORIGINS: http://localhost:3000
      RELAY_KAFKA_BROKERS: ${RELAY_KAFKA_BROKERS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on: [backend-1, backend-2, backend-3, jaeger]

  backend-1:
    <<: *backend
    environment: { PORT: "8081", BACKEND_ID: backend-1 }

  backend-2:
    <<: *backend
    environment: { PORT: "8082", BACKEND_ID: backend-2, LATENCY: 25ms }

  # Fails 40% of requests so the circuit breaker has something to do.
  backend-3:
    <<: *backend
    environment: { PORT: "8083", BACKEND_ID: backend-3, FAIL_RATE: "0.4" }

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9091:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports: ["16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Optional: docker compose --profile audit up, with RELAY_KAFKA_BROKERS=kafka:9092
  kafka:
    image: apache/kafka:3.7.0
    profiles: [audit]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
